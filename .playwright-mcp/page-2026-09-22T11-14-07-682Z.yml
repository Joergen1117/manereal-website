        - generic [ref=e18]: Unser Ansatz
        - heading "Ihre Hausverwaltung in guten Händen" [level=1] [ref=e19]
        - paragraph [ref=e20]: "Sie möchten Ihre Hausverwaltung in guten Händen wissen? Wir führen Ihr Unternehmen weiter: Fair, verlässlich und mit Respekt vor Ihrem Lebenswerk. Diskret und in Ihrem Tempo."
      - generic [ref=e23]:
        - generic [ref=e24]:
          - generic [ref=e25]: Der Weg zu uns
          - heading "Lassen Sie uns diskret und unverbindlich reden" [level=2] [ref=e26]
        - generic [ref=e28]:
          - generic [ref=e29]:
            - generic [ref=e30]: "1"
            - text: Erstgespräch
            - heading "Vertrauliches Kennenlernen" [level=3] [ref=e31]
            - paragraph [ref=e32]: Wir starten mit einem persönlichen Kennenlernen und geben Ihnen Raum für all Ihre Fragen und Anliegen. Vertrauen und ein gemeinsames Verständnis sind für uns die Basis für eine respektvolle und langfristige Partnerschaft.
          - generic [ref=e33]:
            - generic [ref=e34]: "2"
            - text: 1.–2. Woche
            - heading "Konzept und indikatives Angebot" [level=3] [ref=e35]
            - paragraph [ref=e36]: Bei grundsätzlichem Konsens und nach Klärung aller offenen Fragen erhalten Sie ein individuelles Übergabemodell sowie ein indikatives Angebot mit den wesentlichen Eckdaten.
          - generic [ref=e37]:
            - generic [ref=e38]: "3"
            - text: 3.–4. Woche
            - heading "Unternehmensprüfung" [level=3] [ref=e39]
            - paragraph [ref=e40]: Wir prüfen die Themen, die für den nachhaltigen Erfolg Ihrer Hausverwaltung und unsere Partnerschaft entscheidend sind.
          - generic [ref=e41]:
            - generic [ref=e42]: "4"
            - text: 5.–6. Woche
            - heading "Vertrag & Übergabeplan" [level=3] [ref=e43]
            - paragraph [ref=e44]: Neben dem Vertrag vereinbaren wir einen konkreten Kommunikations- und Übergabeplan für Ihre Mitarbeiter und Kunden.
          - generic [ref=e45]:
            - generic [ref=e46]: "5"
            - text: Übergabe
            - heading "Begleitete Umsetzung" [level=3] [ref=e47]
            - paragraph [ref=e48]: Strukturierter Übergang mit größtmöglicher Kontinuität für Ihre Mitarbeiter, Kunden und das Tagesgeschäft.
        - img "Handschlag zwischen zwei Unternehmern" [ref=e49]
      - generic [ref=e51]:
        - generic [ref=e52]: Herausforderungen & Lösungen
        - heading "Wir kennen die Herausforderungen Ihrer Branche" [level=2] [ref=e53]
        - paragraph [ref=e54]: Im Zusammenschluss lösen wir die Herausforderungen der Hausverwaltungsbranche und heben Potenziale, die allein nicht erreichbar sind.
        - generic [ref=e55]:
          - article [ref=e56]:
            - heading "Nachfolge" [level=3] [ref=e57]
            - paragraph [ref=e58]: Kein interner oder familiärer Nachfolger in Sicht. Der Betrieb hängt an einer Person.
            - generic [ref=e59]:
              - generic [ref=e60]: Unsere Lösung
              - paragraph [ref=e61]: "Wir führen den Betrieb weiter: Mit Übergabeplan, in Ihrem Tempo, ohne Bruch für Kunden und Team."
          - article [ref=e62]:
            - heading "Fachkräftemangel" [level=3] [ref=e63]
            - paragraph [ref=e64]: Qualifizierte Verwalter sind kaum zu finden, Schlüsselpositionen bleiben lange offen.
            - generic [ref=e65]:
              - generic [ref=e66]: Unsere Lösung
              - paragraph [ref=e67]: Gemeinsames Recruiting, eigene Qualitätsstandards und Fachkräfte aus dem Verbund, wenn Ihr Team sie braucht.
          - article [ref=e68]:
            - heading "Transformation & Digitalisierung" [level=3] [ref=e69]
            - paragraph [ref=e70]: Digitalisierung und neue Anforderungen verlangen Investitionen, die sich für einen Betrieb allein selten rechnen.
            - generic [ref=e71]:
              - generic [ref=e72]: Unsere Lösung
              - paragraph [ref=e73]: Software und Prozesse werden einmal für die Gruppe finanziert. Sie nutzen sie, ohne allein zu investieren.
          - article [ref=e74]:
            - heading "Kostenstruktur" [level=3] [ref=e75]
            - paragraph [ref=e76]: Personal-, IT- und Regulierungskosten steigen, die Honorare lassen sich nicht beliebig anheben.
            - generic [ref=e77]:
              - generic [ref=e78]: Unsere Lösung
              - paragraph [ref=e79]: "Buchhaltung, Recht, Versicherung und Einkauf im Verbund: Fixkosten verteilen sich auf viele Schultern."
      - generic [ref=e81]:
        - generic [ref=e82]: Die Stärken der Gruppe
        - heading "Was Ihr Betrieb im Verbund gewinnt" [level=2] [ref=e83]
        - generic [ref=e84]:
          - generic [ref=e85]:
            - heading "Ihr Team im Verbund gestärkt" [level=3] [ref=e89]
            - paragraph [ref=e90]: Pragmatische Personallösungen, attraktive Lohn- und Bonusmodelle, gemeinsames Recruiting und der Aufbau eines gruppenweiten Fachkräftepools.
          - generic [ref=e91]:
            - heading "Digital & effizient" [level=3] [ref=e96]
            - paragraph [ref=e97]: "Erprobte Systeme statt teurer Experimente: Die Gruppe finanziert Software und Digitalisierung einmal für alle, und Ihr Betrieb arbeitet vom ersten Tag an damit."
          - generic [ref=e98]:
            - heading "Synergien & Skalen" [level=3] [ref=e102]
            - paragraph [ref=e103]: "Gemeinsam erreicht die Gruppe, was ein Betrieb allein nicht schafft: Weniger Doppelarbeit und bessere Konditionen durch Zusammenarbeit bei Buchhaltung, Recht, Versicherung und Einkauf."
          - generic [ref=e104]:
            - heading "Sichtbarkeit" [level=3] [ref=e109]
            - paragraph [ref=e110]: Ein professioneller Auftritt und gemeinsames Marketing verschaffen Ihrem Betrieb mehr Sichtbarkeit am Markt.
          - generic [ref=e111]:
            - heading "Finanzen & Reporting" [level=3] [ref=e115]
            - paragraph [ref=e116]: "Klare Zahlen als Grundlage für gute Entscheidungen: Controlling und Auswertungen aus einer Hand."
