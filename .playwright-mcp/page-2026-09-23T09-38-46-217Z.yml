      - heading "2. Hosting" [level=2] [ref=f1e349]
      - paragraph [ref=f1e350]: "Diese Website wird über die Plattform Vercel Inc. (340 S Lemon Ave #4133, Walnut, CA 91789, USA) gehostet. Beim Aufruf der Website verarbeitet Vercel automatisch technische Zugriffsdaten (IP-Adresse, Datum und Uhrzeit des Zugriffs, aufgerufene Seite, Browsertyp und -version, verwendetes Betriebssystem) in Server-Logfiles. Diese Verarbeitung erfolgt auf Grundlage unseres berechtigten Interesses an einem sicheren, stabilen und performanten Betrieb der Website (Art. 6 Abs. 1 lit. f DSGVO)."
      - paragraph [ref=f1e351]:
        - text: "Da Vercel Inc. ein US-amerikanisches Unternehmen ist, kann es dabei zu einer Übermittlung personenbezogener Daten in die USA (Drittland) kommen. Vercel ist nach eigenen Angaben unter dem EU-U.S. Data Privacy Framework zertifiziert; ergänzend werden, soweit erforderlich, EU-Standardvertragsklauseln (Art. 46 DSGVO) als Garantie für ein angemessenes Datenschutzniveau eingesetzt. Weitere Informationen:"
