        - text: und
        - link "vercel.com/legal/dpa" [ref=f1e353] [cursor=pointer]:
          - /url: https://vercel.com/legal/dpa
        - text: .
      - paragraph [ref=f1e354]: Die Logfiles werden nach 30 Tagen automatisch gelöscht.
      - heading "3. Kontaktaufnahme" [level=2] [ref=f1e355]
      - paragraph [ref=f1e356]: Wenn Sie uns per E-Mail oder Telefon kontaktieren, verarbeiten wir Ihre Angaben zur Bearbeitung der Anfrage und für Anschlussfragen (Art. 6 Abs. 1 lit. b und f DSGVO). Ihre Daten werden vertraulich behandelt und nicht ohne Ihre Zustimmung weitergegeben.
      - heading "4. Cookies und Tracking" [level=2] [ref=f1e357]
      - paragraph [ref=f1e358]: Diese Website verwendet keine Cookies zu Analyse- oder Marketingzwecken.
      - heading "5. Ihre Rechte" [level=2] [ref=f1e359]
      - paragraph [ref=f1e360]: Ihnen stehen die Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch zu. Sie können sich zudem bei der österreichischen Datenschutzbehörde (dsb.gv.at) beschweren.
