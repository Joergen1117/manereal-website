        - generic [ref=f1e18]: Unser Ansatz
        - heading "Ihre Hausverwaltung in guten Händen" [level=1] [ref=f1e19]
        - paragraph [ref=f1e20]: "Sie möchten Ihre Hausverwaltung in guten Händen wissen? Wir führen Ihr Unternehmen weiter: Fair, verlässlich und mit Respekt vor Ihrem Lebenswerk. Diskret und in Ihrem Tempo."
      - generic [ref=f1e23]:
        - generic [ref=f1e24]:
          - generic [ref=f1e25]: Der Weg zu uns
          - heading "Lassen Sie uns diskret und unverbindlich reden" [level=2] [ref=f1e26]
        - generic [ref=f1e28]:
          - generic [ref=f1e29]:
            - generic [ref=f1e30]: "1"
            - text: Erstgespräch
            - heading "Vertrauliches Kennenlernen" [level=3] [ref=f1e31]
            - paragraph [ref=f1e32]: Wir starten mit einem persönlichen Kennenlernen und geben Ihnen Raum für all Ihre Fragen und Anliegen. Vertrauen und ein gemeinsames Verständnis sind für uns die Basis für eine respektvolle und langfristige Partnerschaft.
          - generic [ref=f1e33]:
            - generic [ref=f1e34]: "2"
            - text: 1.–2. Woche
            - heading "Konzept und indikatives Angebot" [level=3] [ref=f1e35]
            - paragraph [ref=f1e36]: Bei grundsätzlichem Konsens und nach Klärung aller offenen Fragen erhalten Sie ein individuelles Übergabemodell sowie ein indikatives Angebot mit den wesentlichen Eckdaten.
          - generic [ref=f1e37]:
            - generic [ref=f1e38]: "3"
            - text: 3.–4. Woche
            - heading "Unternehmensprüfung" [level=3] [ref=f1e39]
            - paragraph [ref=f1e40]: Wir prüfen die Themen, die für den nachhaltigen Erfolg Ihrer Hausverwaltung und unsere Partnerschaft entscheidend sind.
          - generic [ref=f1e41]:
            - generic [ref=f1e42]: "4"
            - text: 5.–6. Woche
            - heading "Vertrag & Übergabeplan" [level=3] [ref=f1e43]
            - paragraph [ref=f1e44]: Neben dem Vertrag vereinbaren wir einen konkreten Kommunikations- und Übergabeplan für Ihre Mitarbeiter und Kunden.
          - generic [ref=f1e45]:
            - generic [ref=f1e46]: "5"
            - text: Übergabe
            - heading "Begleitete Umsetzung" [level=3] [ref=f1e47]
            - paragraph [ref=f1e48]: Strukturierter Übergang mit größtmöglicher Kontinuität für Ihre Mitarbeiter, Kunden und das Tagesgeschäft.
        - img "Handschlag zwischen zwei Unternehmern" [ref=f1e49]
      - generic [ref=f1e51]:
        - generic [ref=f1e52]: Herausforderungen & Lösungen
        - heading "Wir kennen die Herausforderungen Ihrer Branche" [level=2] [ref=f1e53]
        - paragraph [ref=f1e54]: Im Zusammenschluss lösen wir die Herausforderungen der Hausverwaltungsbranche und heben Potenziale, die allein nicht erreichbar sind.
        - generic [ref=f1e55]:
          - article [ref=f1e56]:
            - generic [ref=f1e57]:
              - heading "Nachfolge" [level=3] [ref=f1e58]
              - paragraph [ref=f1e59]: Kein interner oder familiärer Nachfolger in Sicht. Der Betrieb hängt an einer Person.
            - paragraph [ref=f1e61]: "Wir führen den Betrieb weiter: Mit Übergabeplan, in Ihrem Tempo, ohne Bruch für Kunden und Team."
          - article [ref=f1e62]:
            - generic [ref=f1e63]:
              - heading "Fachkräftemangel" [level=3] [ref=f1e64]
              - paragraph [ref=f1e65]: Qualifizierte Verwalter sind kaum zu finden, Schlüsselpositionen bleiben lange offen.
            - paragraph [ref=f1e67]: Gemeinsames Recruiting, eigene Qualitätsstandards und Fachkräfte aus dem Verbund, wenn Ihr Team sie braucht.
          - article [ref=f1e68]:
            - generic [ref=f1e69]:
              - heading "Transformation & Digitalisierung" [level=3] [ref=f1e70]
              - paragraph [ref=f1e71]: Digitalisierung und neue Anforderungen verlangen Investitionen, die sich für einen Betrieb allein selten rechnen.
            - paragraph [ref=f1e73]: Software und Prozesse werden einmal für die Gruppe finanziert. Sie nutzen sie, ohne allein zu investieren.
          - article [ref=f1e74]:
            - generic [ref=f1e75]:
              - heading "Kostenstruktur" [level=3] [ref=f1e76]
              - paragraph [ref=f1e77]: Personal-, IT- und Regulierungskosten steigen, die Honorare lassen sich nicht beliebig anheben.
            - paragraph [ref=f1e79]: "Buchhaltung, Recht, Versicherung und Einkauf im Verbund: Fixkosten verteilen sich auf viele Schultern."
