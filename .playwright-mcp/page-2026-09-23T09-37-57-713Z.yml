        - generic [ref=f1e141]: Wer wir sind
        - heading "Über Manereal" [level=1] [ref=f1e142]
        - paragraph [ref=f1e143]: Wir verbinden Branchenerfahrung mit unternehmerischer Schlagkraft und Nachfolgeexpertise.
      - generic [ref=f1e145]:
        - generic [ref=f1e146]:
          - generic [ref=f1e147]:
            - img "Jörgen Oberkofler" [ref=f1e149]
            - heading "Jörgen Oberkofler" [level=3] [ref=f1e150]
            - paragraph [ref=f1e151]: Jörgen begleitet seit über 12 Jahren Unternehmerinnen und Unternehmer im DACH-Raum als Käufer, Entwickler und Sparringspartner bei der Übergabe ihres Betriebs. Sein Antrieb ist es, Lebenswerke weiterzuführen und Kontinuität in Unternehmen zu wahren.
          - generic [ref=f1e152]:
            - img "Lorenz Ambrosius" [ref=f1e154]
            - heading "Lorenz Ambrosius" [level=3] [ref=f1e155]
            - paragraph [ref=f1e156]: Lorenz begleitet seit über 5 Jahren mittelständische Unternehmen bei Finanzierungen, der strategischen Weiterentwicklung und Integration in Gruppen. Er hat dabei Betriebe durch unterschiedliche Phasen der Veränderung geführt und weiß, wie aus einer Übergabe ein stabiler Neustart wird.
          - generic [ref=f1e157]:
