        - generic [ref=f1e162]:
          - heading "Team an Hausverwaltern" [level=3] [ref=f1e170]
          - generic [ref=f1e171]:
            - paragraph [ref=f1e172]: Hinter Manereal stehen erfahrene Partner aus Fachleuten der Hausverwaltungsbranche mit mehr als 15 Jahren Erfahrung in der täglichen Verwaltungspraxis.
            - paragraph [ref=f1e173]: Sie kennen die Herausforderungen einer professionellen Hausverwaltung aus erster Hand – von der Betreuung von Eigentümern und Liegenschaften über die Führung von Teams bis hin zu Instandhaltung, kaufmännischen Prozessen und rechtlichen Fragestellungen.
            - paragraph [ref=f1e174]: Dieses Wissen fließt direkt in unseren Ansatz ein. Gemeinsam verbinden wir unternehmerisches Denken mit langjähriger Branchenerfahrung und schaffen so die Grundlage für eine verantwortungsvolle Übergabe und die nachhaltige Weiterentwicklung Ihrer Hausverwaltung.
